name: Dependabot Auto-merge

# Why pull_request_target instead of pull_request:
#   pull_request runs in the fork/branch context with read-only permissions.
#   Dependabot PRs are treated as forks, so auto-merge via `gh pr merge` needs
#   write access — only pull_request_target provides that. This is the standard
#   Dependabot auto-merge pattern endorsed by GitHub Actions docs.
#
# Policy: dependabot.yml disables routine version-update PRs, so Dependabot PRs
# are targeted security fixes. Queue each one for auto-merge; branch protection's
# required `ci` check is the guard, so a fix that breaks install, audit, lint,
# types, tests, or build cannot land.
#
# Mitigations against pull_request_target abuse:
#   1. Hard actor check (if: github.actor == 'dependabot[bot]') — skips the job
#      entirely for any non-Dependabot PR, preventing the elevated context from
#      being triggered by external contributors or forks.
#   2. Minimal permissions scope — only contents: write + pull-requests: write,
#      the two scopes `gh pr merge --auto` needs (contents to queue the merge and
#      read the PR's commits, pull-requests to enable auto-merge). No other
#      elevated scopes. The hard actor gate above keeps this context Dependabot-only.
#   3. No checkout of PR head and no third-party actions — the job only calls the
#      gh CLI, so untrusted PR code never executes in this elevated context.
#
# Auto-merge only *queues* the merge: the branch-protected `ci` check must pass
# first, so a security fix that breaks validation never lands.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Hard gate: skip entirely for non-Dependabot PRs.
    if: github.actor == 'dependabot[bot]'
    steps:
      # Queue the security fix — GitHub merges only after required CI passes.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
