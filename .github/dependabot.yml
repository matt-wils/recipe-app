version: 2

updates:
  # Security-only policy: keep these ecosystem entries so Dependabot security
  # updates can use this configuration, but disable routine version-update PRs.
  # Security updates are raised when an advisory applies; this schedule is only
  # a required field and does not delay them.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'
    open-pull-requests-limit: 0

  # Apply the same security-only policy to actions used by the workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'
    open-pull-requests-limit: 0
